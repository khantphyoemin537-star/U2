<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Card Market</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-title">Card Market</div>
  <div class="balance-pill">
    <span class="balance-amount" id="balance-amount">—</span>
    <span class="balance-label">ccm</span>
  </div>
</header>

<main id="view-root">
  <!-- MARKET -->
  <section class="view" id="view-market">
    <div class="view-head">
      <h1>The floor</h1>
      <p class="view-sub">Buy now, or place a bid before time runs out.</p>
    </div>
    <div class="card-grid" id="market-grid"></div>
  </section>

  <!-- MY CARDS -->
  <section class="view" id="view-cards" hidden>
    <div class="view-head">
      <h1>Your spares</h1>
      <p class="view-sub">Cards beyond your favorites — list them or scrap them for ccm.</p>
    </div>
    <div class="card-grid" id="cards-grid"></div>
  </section>

  <!-- MY LISTINGS -->
  <section class="view" id="view-listings" hidden>
    <div class="view-head">
      <h1>Out on the floor</h1>
      <p class="view-sub">What you've listed, live right now.</p>
    </div>
    <div class="card-grid" id="listings-grid"></div>
  </section>

  <!-- MY BIDS -->
  <section class="view" id="view-bids" hidden>
    <div class="view-head">
      <h1>In the running</h1>
      <p class="view-sub">Auctions where you're the current highest bid.</p>
    </div>
    <div class="card-grid" id="bids-grid"></div>
  </section>
</main>

<nav class="tabbar">
  <button class="tab active" data-view="market">
    <span class="tab-mark"></span><span>Market</span>
  </button>
  <button class="tab" data-view="cards">
    <span class="tab-mark"></span><span>Cards</span>
  </button>
  <button class="tab" data-view="listings">
    <span class="tab-mark"></span><span>Listings</span>
  </button>
  <button class="tab" data-view="bids">
    <span class="tab-mark"></span><span>Bids</span>
  </button>
</nav>

<!-- Card detail / action sheet -->
<div class="sheet-backdrop" id="sheet-backdrop" hidden>
  <div class="sheet" id="sheet"></div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
